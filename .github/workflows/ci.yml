name: Python Weather CLI CI/CD

on:
  push:
    branches:
      - prod
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - prod
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        os: [ubuntu-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Flake8 (for linting) and project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt # Includes pytest, pytest-mock, pytest-cov

    - name: Lint with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Set dummy API key for tests
      run: echo "OPENWEATHERMAP_API_KEY=ci_dummy_key_for_pytest_session" >> $GITHUB_ENV

    - name: Run Pytest test suite
      run: |
        pytest --cov=weather_cli --cov-report=xml --cov-report=term-missing tests/